# Builds an unsigned .ipa on a GitHub-hosted macOS runner, so the app can be
# signed on Windows with 爱思助手 (i4Tools) and installed without a Mac.
#
#   Actions → "Build unsigned IPA" → Run workflow
#   → download the `FudAI-unsigned-ipa` artifact → unzip → hand the .ipa to 爱思助手
#
# The archive is built with CODE_SIGNING_ALLOWED=NO: no Apple ID, no
# certificates, no secrets in this repository. All signing happens on the
# Windows side.
name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [sideload]
  pull_request:
    paths:
      - '.github/workflows/build-unsigned-ipa.yml'

permissions:
  contents: read

concurrency:
  group: build-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List the installed Xcode versions
        run: ls -1 /Applications | grep -i '^Xcode' || true

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"

      - name: Check the toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode /{split($2,v,"."); print v[1]}')"
          if [ "$major" -lt 27 ]; then
            echo "::warning::Upstream Fud AI wants Xcode 27 (iOS 27 FoundationModels image APIs). This runner has Xcode $major; the iOS 27-only on-device image analysis is compiled out below via FUDAI_NO_IOS27."
            echo "FUDAI_NO_IOS27=1" >> "$GITHUB_ENV"
          fi

      - name: Ensure the Metal shader toolchain is installed
        run: |
          if [ -f scripts/ci/ensure_metal_toolchain.sh ]; then
            bash scripts/ci/ensure_metal_toolchain.sh
          else
            echo "No Metal toolchain helper; using the default toolchain."
          fi

      - name: Resolve Swift packages
        run: |
          xcodebuild -project ios/calorietracker.xcodeproj \
            -scheme calorietracker \
            -resolvePackageDependencies

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/calorietracker.xcodeproj \
            -scheme calorietracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_SWIFT_FLAGS="-DFUDAI_NO_IOS27" \
            WORKOUT_VECTORS=none \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # xcodebuild's failure message scrolls away in a 20k-line log; surface it.
      - name: Show the build errors
        if: failure()
        run: |
          echo "=== error lines ==="
          grep -nE "error:|fatal error:|BUILD FAILED|Command .* failed|failed with exit code" "$RUNNER_TEMP/build.log" | head -60 || echo "(no error: lines found)"
          echo
          echo "=== last 40 lines ==="
          tail -40 "$RUNNER_TEMP/build.log"

      - name: Package the IPA
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/calorietracker.app"
          if [ ! -d "$APP" ]; then
            echo "::error::No calorietracker.app in $PRODUCTS"
            ls -la "$RUNNER_TEMP/DerivedData/Build/Products" || true
            ls -la "$PRODUCTS" || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/calorietracker.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/FudAI-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/FudAI-unsigned.ipa" | head -20

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: FudAI-unsigned-ipa
          path: ${{ runner.temp }}/FudAI-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Keep the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
